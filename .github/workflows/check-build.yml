# Fails if index.html wasn't rebuilt after editing data.js, or if a test breaks.
name: check-build

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/*.test.mjs"
      - run: node build/build.mjs --check
