<!doctype html>
<!-- Source for assets/og.png (the link-preview card). Re-render with:
     node scripts/probe.mjs --url http://localhost:8000/build/og-card.html --width 1200 --height 630 --shot assets/og.png build/og-noop.js -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #ffffff;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-columns: 120px 1fr;
    padding: 84px 96px 84px 72px;
  }
  /* The site's signature: grey until the turn, blue after, dashed into what's next */
  .rail { position: relative; }
  .rail::before {
    content: ""; position: absolute; left: 50%; top: 10px; bottom: 10px; width: 4px; margin-left: -2px;
    background: linear-gradient(to bottom, #d2d2d7 0 36%, #0071e3 36% 82%, transparent 82%);
  }
  .rail::after {
    content: ""; position: absolute; left: 50%; top: 82%; bottom: 10px; width: 4px; margin-left: -2px;
    background: repeating-linear-gradient(to bottom, #0071e3 0 8px, transparent 8px 16px);
  }
  .node { position: absolute; z-index: 1; left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
          background: #fff; border: 4px solid #86868b; }
  .node.turn { background: #0071e3; border-color: #0071e3; }
  .node.next { border-color: #0071e3; }
  .copy { align-self: center; padding-left: 24px; }
  .name { font-size: 30px; font-weight: 600; color: #6e6e73; letter-spacing: -0.01em; }
  h1 { margin-top: 18px; font-size: 76px; line-height: 1.04; font-weight: 600; letter-spacing: -0.03em; max-width: 14ch; }
  .sub { margin-top: 28px; font-size: 28px; color: #6e6e73; letter-spacing: 0.005em; }
  .sub b { color: #0071e3; font-weight: 600; }
</style>
</head>
<body>
  <div class="rail" aria-hidden="true">
    <span class="node" style="top:12%"></span>
    <span class="node" style="top:26%"></span>
    <span class="node turn" style="top:40%"></span>
    <span class="node" style="top:55%"></span>
    <span class="node turn" style="top:70%"></span>
    <span class="node next" style="top:94%"></span>
  </div>
  <div class="copy">
    <p class="name">Aswin Sunil · Kochi</p>
    <h1>Not a straight line. A few good turns.</h1>
    <p class="sub">College → QA at Aspire → <b>security</b></p>
  </div>
</body>
</html>
